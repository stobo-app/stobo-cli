[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stobo"
version = "0.4.0"
description = "Stobo CLI — retired (the Stobo SEO/AEO audit service was shut down in 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Stobo", email = "hello@trystobo.com"}]
keywords = ["seo", "aeo", "audit", "ai", "cli", "content-optimization"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://trystobo.com"
Documentation = "https://trystobo.com"
Repository = "https://github.com/stobo-app/stobo-cli"

[project.scripts]
stobo = "stobo.cli:app"
